name: Veille juridique ACRA

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Générer la veille via IA (recherche web)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          from datetime import date

          today = date.today()
          DATE = today.strftime('%d-%m-%Y')
          ANNEE = today.strftime('%Y')
          os.makedirs(f"veille/{ANNEE}", exist_ok=True)
          FICHIER = f"veille/{ANNEE}/{DATE}.md"

          prompt = (
              f"Fais une veille juridique datée du {DATE} pour un juriste basé au Bénin. "
              "Cherche les actualités juridiques récentes (dernières 24-48h) dans ces rubriques : "
              "1) Bénin (lois, décrets, jurisprudence) 2) OHADA / CCJA 3) UEMOA 4) CEDEAO "
              "5) IA et droit numérique 6) Droit international pertinent pour l'Afrique de l'Ouest. "
              "Pour chaque actualité : titre, date, source, résumé en 2-3 phrases, lien. "
              "Si rien de notable pour une rubrique, écris 'Rien de notable aujourd'hui.'. "
              "Réponds uniquement en Markdown, en français, avec des titres de niveau 2 (##) par rubrique."
          )

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "tools": [{"google_search": {}}],
          }

          req = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"],
                  "Content-Type": "application/json",
              },
          )

          with urllib.request.urlopen(req) as resp:
              data = json.load(resp)

          texte = ""
          for candidate in data.get("candidates", []):
              for part in candidate.get("content", {}).get("parts", []):
                  if "text" in part:
                      texte += part["text"] + "\n"

          with open(FICHIER, "w", encoding="utf-8") as f:
              f.write(f"# ⚖️ Veille juridique ACRA — {DATE}\n\n")
              f.write(texte)
          EOF

      - name: Enregistrer la veille
        run: |
          git config user.name "ACRA Veille"
          git config user.email "acra-veille@users.noreply.github.com"
          git add veille/
          git commit -m "Veille juridique du jour" || echo "Rien à commit"
          git push
