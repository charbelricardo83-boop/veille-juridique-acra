name: Veille juridique ACRA

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Générer la veille (Google News RSS)
        run: |
          python3 - <<'EOF'
          import os, html
          from datetime import date
          from urllib.request import urlopen, Request
          from urllib.parse import quote
          import xml.etree.ElementTree as ET

          today = date.today()
          DATE = today.strftime('%d-%m-%Y')
          ANNEE = today.strftime('%Y')
          os.makedirs(f"veille/{ANNEE}", exist_ok=True)
          FICHIER = f"veille/{ANNEE}/{DATE}.md"

          rubriques = [
              ("🇧🇯 Bénin", "Bénin (loi OR décret OR justice OR droit)"),
              ("⚖️ OHADA / CCJA", "OHADA OR CCJA"),
              ("🌍 UEMOA", "UEMOA droit"),
              ("🌍 CEDEAO", "CEDEAO droit"),
              ("🤖 IA et droit numérique", "intelligence artificielle droit Afrique"),
              ("🌐 Droit international", "droit international Afrique de l'Ouest"),
          ]

          lignes = [f"# ⚖️ Veille juridique ACRA — {DATE}\n"]

          for titre, requete in rubriques:
              lignes.append(f"\n## {titre}\n")
              url = f"https://news.google.com/rss/search?q={quote(requete)}&hl=fr&gl=BJ&ceid=BJ:fr"
              try:
                  req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urlopen(req, timeout=20) as resp:
                      data = resp.read()
                  root = ET.fromstring(data)
                  items = root.findall(".//item")[:5]
                  if not items:
                      lignes.append("Rien de notable aujourd'hui.\n")
                  for item in items:
                      titre_article = html.unescape(item.findtext("title", ""))
                      lien = item.findtext("link", "")
                      date_pub = item.findtext("pubDate", "")
                      lignes.append(f"- **{titre_article}** ({date_pub}) — [Lire]({lien})\n")
              except Exception as e:
                  lignes.append(f"Erreur de récupération : {e}\n")

          with open(FICHIER, "w", encoding="utf-8") as f:
              f.write("".join(lignes))
          EOF

      - name: Enregistrer la veille
        run: |
          git config user.name "ACRA Veille"
          git config user.email "acra-veille@users.noreply.github.com"
          git add veille/
          git commit -m "Veille juridique du jour" || echo "Rien à commit"
          git push
